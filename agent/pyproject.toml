[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-agent"
version = "0.1.0"
description = "Structured execution agent for the Prometheus platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "psutil>=7.0.0",
  "pydantic-settings>=2.8.0",
]

[project.scripts]
prometheus-agent = "prometheus_agent.main:main"

[tool.setuptools.packages.find]
include = ["prometheus_agent*"]
